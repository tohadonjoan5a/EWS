        const hitungRate = (nper, pmt, pv) => {
            if (nper === 0) return 0;
            let rate = 0.05; 
            for (let i = 0; i < 100; i++) {
                let f = pv * Math.pow(1 + rate, nper) + pmt * (Math.pow(1 + rate, nper) - 1) / rate;
                let df = pv * nper * Math.pow(1 + rate, nper - 1) + pmt * ((nper * Math.pow(1 + rate, nper - 1) * rate - (Math.pow(1 + rate, nper) - 1)) / (rate * rate));
                let newRate = rate - f / df;
                if (Math.abs(newRate - rate) < 1e-7) return newRate;
                rate = newRate;
            }
            return rate;
        };

        const hitungBakiDebet = (plafon, tenor, angsuranTerbayar, angsuranPerBulan) => {
            if (!plafon || !tenor || tenor <= 0 || !angsuranPerBulan) return plafon || 0;
            if (angsuranTerbayar >= tenor) return 0;
            if (angsuranTerbayar <= 0) return plafon;

            try {
                const rate = hitungRate(tenor, -angsuranPerBulan, plafon);
                if (rate <= 0 || isNaN(rate)) {
                    const bakiFlat = plafon - ((plafon / tenor) * angsuranTerbayar);
                    return Math.max(0, Math.round(bakiFlat));
                }
                const sisaTenor = tenor - angsuranTerbayar;
                const baki = angsuranPerBulan * ((1 - Math.pow(1 + rate, -sisaTenor)) / rate);
                return Math.max(0, Math.round(baki));
            } catch (e) {
                return plafon; 
            }
        };

        const calculateDPD = (jatuhTempoStr, statusTunggakan) => {
            if (statusTunggakan === 0) return 0;
            const dueDay = parseInt(jatuhTempoStr.replace(/\D/g, ''));
            if (isNaN(dueDay)) return 0;

            const today = new Date();
            let missedDate = new Date(today.getFullYear(), today.getMonth(), dueDay);

            if (missedDate > today) {
                missedDate.setMonth(missedDate.getMonth() - 1);
            }
            missedDate.setMonth(missedDate.getMonth() - (statusTunggakan - 1));

            const diffTime = today - missedDate;
            if (diffTime < 0) return 0; 
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        };

                    if (diff < 0 && (diff + daysInMonth >= 0 && diff + daysInMonth <= 3)) {

                    if (isMenunggak || isH3) {
                        let sortValue = isMenunggak ? -dpd : diff;
                        return { ...client, isMenunggak, dpd, daysUntilDue: diff, sortValue };
                    }
                    return null;

                    angsuranTerbayar: Number(formData.angsuranTerbayar) || 0, angsuranPerBulan: Number(formData.angsuranPerBulan) || 0,

                setPortfolio([newCustomer, ...portfolio]); setIsModalOpen(false); setCurrentPage(1);

                    let statusName = "Lancar";
                    if (client.statusTunggakan === 1) statusName = "Nunggak 1 Bulan"; else if (client.statusTunggakan === 2) statusName = "Nunggak 2 Bulan";
                    else if (client.statusTunggakan === 3) statusName = "Nunggak 3 Bulan"; else if (client.statusTunggakan === 4) statusName = "Nunggak >3 Bulan";

                    return {
                        "No": index + 1, "No. CIF": client.cif, "Nama Nasabah": client.name, "No. HP": client.noHp, "Alamat": client.alamat, 
                        "Nama IFO": client.namaIfo || "-", "No. Rekening": client.noRek,

                                                    <div className="text-xs text-slate-500 mt-1"><i className="far fa-handshake text-orange-400 mr-1"></i>Akad: <span className="font-semibold">{formatDate(client.tanggalAkad)}</span></div>

                                    <h2 className="text-lg font-bold"><i className="fas fa-bell mr-2 animate-bounce"></i>Early Warning System (EWS)</h2>
                                    <div className="flex items-center space-x-2">
                                        <button onClick={exportEwsAsImage} disabled={isExportingImage} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow flex items-center transition-colors">
                                            <i className={`fas ${isExportingImage ? 'fa-spinner fa-spin' : 'fa-camera'} mr-1.5`}></i> {isExportingImage ? 'Memproses HD...' : 'Export Foto HD'}
                                        </button>
                                        <button onClick={() => setIsEwsModalOpen(false)} className="text-white hover:text-rose-200 transition-colors ml-2"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                </div>
                                
                                <div className="p-5 overflow-y-auto bg-slate-50 flex-grow">
                                    <div className="mb-4 bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded-lg text-sm flex items-start">
                                        <i className="fas fa-exclamation-triangle mt-0.5 mr-2 text-orange-600 text-lg"></i>
                                        <p>Tekan tombol hijau '✅ Bayar' di baris angsuran jika nasabah telah melunasi setoran, atau isi Tanggal Janji Bayar untuk menjadwalkan ulang penagihan.</p>
                                    </div>
                                    
                                    <div ref={ewsTableRef} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden p-2">
                                        <div className="px-4 py-3 border-b bg-slate-100 flex justify-between items-center">
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-sm">LAPORAN MONITORING EWS & PEMBAYARAN</h3>
                                                <p className="text-xs text-slate-500">BTPN Syariah - Area Medan | Tanggal Cetak: {new Date().toLocaleDateString('id-ID', {year:'numeric', month:'long', day:'numeric'})}</p>
                                            </div>
                                            <div className="text-right text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1 rounded border border-rose-200">
                                                Total Dipantau: {ewsCombinedList.length} Nasabah
                                            </div>
                                        </div>
                                        <table className="min-w-full divide-y divide-slate-200">
                                            <thead className="bg-slate-50 text-left text-xs font-bold text-slate-600 uppercase">
                                                <tr>
                                                    <th className="px-4 py-3 w-1/4">Nasabah & No. Rekening</th>
                                                    <th className="px-4 py-3 text-center">IFO Pengelola</th>
                                                    <th className="px-4 py-3 text-center">Status EWS & Jatuh Tempo</th>
                                                    <th className="px-4 py-3 text-center">Jumlah Angsuran & Bayar</th>
                                                    <th className="px-4 py-3 text-center">Tanggal Janji Bayar</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {ewsCombinedList.length > 0 ? ewsCombinedList.map(client => {
                                                    const isLunasBulanIni = client.angsuranTerbayar >= client.tenor;
                                                    return (
                                                        <tr key={`ews-cb-${client.internalId}`} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-4 py-3">
                                                                <div className="font-bold text-slate-800">{client.name}</div>
                                                                <div className="text-xs text-slate-500 font-semibold mt-1"><i className="fas fa-credit-card text-emerald-500 mr-1"></i> Rek: {client.noRek || '-'}</div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center align-middle">
                                                                {isPrintMode ? (
                                                                    <div className="font-bold text-slate-800 text-sm">{client.namaIfo || "Agung"}</div>
                                                                ) : (
                                                                    <select value={client.namaIfo || "Agung"} onChange={(e) => updateIfo(client.internalId, e.target.value)} className="border border-slate-300 bg-white rounded px-2 py-1.5 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 w-full max-w-[120px] mx-auto shadow-sm">
                                                                        {ifoList.map(name => <option key={name} value={name}>{name}</option>)}
                                                                    </select>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                {client.isMenunggak ? (
                                                                    <>
                                                                        <div className={`text-xs font-bold mb-1 ${getOsColor(client.statusTunggakan)}`}>{client.statusTunggakan === 4 ? '>3 Bulan' : `${client.statusTunggakan} Bulan`} (Kol {client.kolektibilitas})</div>
                                                                        <div className="text-[11px] font-black text-rose-700 bg-rose-100 border border-rose-300 inline-block px-2 py-0.5 rounded-full">{client.dpd} Hari (DPD)</div>
                                                                    </>
                                                                ) : (
                                                                    <div className={`px-3 py-1 rounded-full text-xs shadow-sm inline-block font-bold mb-1 ${client.daysUntilDue === 0 ? "bg-rose-100 text-rose-700 ring-1 ring-rose-400" : (client.daysUntilDue === 1 ? "bg-orange-100 text-orange-700" : "bg-blue-100 text-blue-700")}`}>
                                                                        {client.daysUntilDue === 0 ? "HARI H" : `H-${client.daysUntilDue}`}
                                                                    </div>
                                                                )}
                                                                <div className="text-[11px] font-bold text-slate-500 mt-1.5"><i className="far fa-calendar-alt mr-1"></i>{client.jatuhTempo}</div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center align-middle">
                                                                {isLunasBulanIni ? (
                                                                    <div className="font-black text-emerald-500 text-2xl">✅</div>
                                                                ) : (
                                                                    <div className="font-bold text-orange-600 text-sm">{formatRupiah(client.angsuranPerBulan)}</div>
                                                                )}
                                                                
                                                                <div className="mt-1 flex justify-center">
                                                                    {isPrintMode ? (
                                                                        isLunasBulanIni ? <span className="text-xs font-bold text-emerald-600">Sudah Bayar</span> : <span className="text-xs font-bold text-slate-300">-</span>
                                                                    ) : (
                                                                        <button 
                                                                            onClick={() => updateAngsuranTerbayar(client.internalId, 1)} 
                                                                            title="Klik untuk Tandai Sudah Bayar" 
                                                                            className={`px-3 py-1.5 rounded text-[11px] font-bold shadow transition-all flex items-center space-x-1 ${isLunasBulanIni ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}
                                                                            disabled={isLunasBulanIni}
                                                                        >
                                                                            <span>{isLunasBulanIni ? 'Sudah Bayar' : '✅ Bayar'}</span>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center align-middle">
                                                                {isPrintMode ? (
                                                                    <div className="font-bold text-rose-600 text-sm">{client.janjiBayar ? formatDate(client.janjiBayar) : "-"}</div>
                                                                ) : (
                                                                    <input type="date" value={client.janjiBayar || ""} onChange={(e) => updateJanjiBayar(client.internalId, e.target.value)} className="border border-slate-300 bg-white rounded-md px-3 py-1.5 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-rose-500 w-full max-w-[140px] shadow-sm" />
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                }) : (
                                                    <tr><td colSpan="5" className="px-4 py-8 text-center text-slate-500 font-medium"><i className="fas fa-check-circle text-4xl text-emerald-300 mb-3 block"></i>Tidak ada nasabah dalam pantauan EWS saat ini.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div className="bg-slate-100 px-5 py-3 border-t flex justify-end shrink-0 space-x-3">
                                    <button onClick={exportEwsAsImage} disabled={isExportingImage} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-sm shadow flex items-center transition-colors">
                                        <i className={`fas ${isExportingImage ? 'fa-spinner fa-spin' : 'fa-camera'} mr-2`}></i> {isExportingImage ? 'Memproses HD...' : 'Export Foto HD'}
                                    </button>
                                    <button onClick={() => setIsEwsModalOpen(false)} className="px-6 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-lg font-bold text-sm shadow transition-colors">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL TAMBAH DATA (Tidak Ada Perubahan) */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden modal-animate border-2 border-orange-500 flex flex-col max-h-[90vh]">
                                <div className="bg-orange-500 text-white px-5 py-4 flex justify-between items-center">
                                    <h2 className="text-lg font-bold"><i className="fas fa-user-plus mr-2"></i>Form Tambah Nasabah Baru</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-white hover:text-orange-200 transition-colors"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={handleAddSubmit} className="p-6 overflow-y-auto flex-grow">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">No. CIF</label><input type="text" name="cif" value={formData.cif} onChange={handleInputChange} placeholder="Otomatis jika kosong" className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">Nama Nasabah *</label><input required type="text" name="name" value={formData.name} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">No. HP / WhatsApp</label><input type="text" name="noHp" placeholder="08xx xxxx xxxx" value={formData.noHp} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" /></div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">Alamat Lengkap *</label><input required type="text" name="alamat" value={formData.alamat} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" /></div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Nama IFO Pengelola *</label>
                                            <select name="namaIfo" value={formData.namaIfo} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500 bg-white">
                                                {ifoList.map(name => <option key={name} value={name}>{name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">No. Rekening *</label>
                                            <input required type="text" name="noRek" placeholder="Rek 90xxx" value={formData.noRek} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Tanggal Akad & Jatuh Tempo *</label>
                                            <div className="flex space-x-2">
                                                <input required type="date" name="tanggalAkad" title="Tanggal Akad" value={formData.tanggalAkad} onChange={handleInputChange} className="w-1/2 border border-slate-300 rounded-md px-2 py-2 text-sm outline-none focus:border-orange-500" />
                                                <input required type="text" name="jatuhTempo" placeholder="Tgl JT (Mis: Tgl 15)" value={formData.jatuhTempo} onChange={handleInputChange} className="w-1/2 border border-slate-300 rounded-md px-2 py-2 text-sm outline-none focus:border-orange-500" />
                                            </div>
                                        </div>
                                        <hr className="md:col-span-2 my-2 border-slate-200" />
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">Plafon Pembiayaan *</label><input required type="number" name="plafon" value={formData.plafon} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-blue-500" /></div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Tenor & Angsuran Terbayar *</label>
                                            <div className="flex space-x-2">
                                                <input required type="number" name="tenor" placeholder="Tenor" value={formData.tenor} onChange={handleInputChange} className="w-1/2 border border-slate-300 rounded-md px-2 py-2 text-sm outline-none focus:border-blue-500" />
                                                <input required type="number" name="angsuranTerbayar" placeholder="Sdh Bayar" value={formData.angsuranTerbayar} onChange={handleInputChange} className="w-1/2 border border-slate-300 rounded-md px-2 py-2 text-sm outline-none focus:border-blue-500" />
                                            </div>
                                        </div>
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1">Jml Angsuran /Bln *</label><input required type="number" name="angsuranPerBulan" value={formData.angsuranPerBulan} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-blue-500" /></div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Kolektibilitas (Kol)</label>
                                            <select name="kolektibilitas" value={formData.kolektibilitas} onChange={handleInputChange} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500 bg-white">
                                                <option value="1">1 - Lancar</option>
                                                <option value="2">2 - Dalam Perhatian Khusus</option>
                                                <option value="3">3 - Kurang Lancar</option>
                                                <option value="4">4 - Diragukan</option>
                                                <option value="5">5 - Macet</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mt-5 bg-slate-100 p-4 rounded-lg border border-slate-200 text-sm">
                                        <span className="font-bold text-slate-600">Kalkulasi Otomatis Baki Debet (Efektif): </span>
                                        <span className="text-emerald-600 font-black text-base ml-1">
                                            {formatRupiah(hitungBakiDebet(Number(formData.plafon), Number(formData.tenor), Number(formData.angsuranTerbayar), Number(formData.angsuranPerBulan)))}
                                        </span>
                                    </div>
                                    <div className="mt-6 flex justify-end space-x-3 pt-4 border-t border-slate-200">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 text-sm font-bold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors">Batal</button>
                                        <button type="submit" className="px-5 py-2.5 text-sm font-bold text-white bg-orange-500 rounded-lg hover:bg-orange-600 shadow-md transition-colors">Simpan Data Nasabah</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
