<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Kredit</title>
    <!-- Menggunakan Tailwind CSS langsung via CDN agar praktis -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md">
            <div class="container mx-auto">
                <h1 class="text-2xl font-bold">Dashboard Portofolio Kredit</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto p-4 md:p-6">
            <!-- Ringkasan Kartu (Cards) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white p-5 rounded-lg shadow border-t-4 border-blue-500">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase">Total Pencairan</h2>
                    <p class="text-3xl font-bold mt-2">Rp 150.000.000</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border-t-4 border-green-500">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase">Kredit Aktif</h2>
                    <p class="text-3xl font-bold mt-2 text-green-600">45 Nasabah</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border-t-4 border-red-500">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase">Jatuh Tempo Bulan Ini</h2>
                    <p class="text-3xl font-bold mt-2 text-red-600">5 Nasabah</p>
                </div>
            </div>

            <!-- Tabel Data -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Daftar Klien</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left border-collapse">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="py-3 px-6 text-sm font-medium text-gray-600">Nama Nasabah</th>
                                <th class="py-3 px-6 text-sm font-medium text-gray-600">Sisa Pokok</th>
                                <th class="py-3 px-6 text-sm font-medium text-gray-600">Status</th>
                                <th class="py-3 px-6 text-sm font-medium text-gray-600">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="py-4 px-6 text-sm">Budi Santoso</td>
                                <td class="py-4 px-6 text-sm">Rp 5.000.000</td>
                                <td class="py-4 px-6 text-sm">
                                    <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-medium">Lancar</span>
                                </td>
                                <td class="py-4 px-6 text-sm text-blue-600 cursor-pointer hover:underline">Detail</td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="py-4 px-6 text-sm">Siti Aminah</td>
                                <td class="py-4 px-6 text-sm">Rp 2.500.000</td>
                                <td class="py-4 px-6 text-sm">
                                    <span class="bg-yellow-100 text-yellow-800 text-xs px-3 py-1 rounded-full font-medium">Menunggak</span>
                                </td>
                                <td class="py-4 px-6 text-sm text-blue-600 cursor-pointer hover:underline">Detail</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-gray-300 text-center p-4 mt-auto">
            <p class="text-sm">&copy; 2026 TOHA AMI JAYA. All rights reserved.</p>
        </footer>
        
    </div>
</body>
</html>
